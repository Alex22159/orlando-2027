.banner::after {
  height: 65px;
  bottom: -49px;
}
.brand {
  width: max-content;
  max-width: 100%;
  margin: 0;
  text-align: center;
  font-size: clamp(1.85rem, 7vw, 3.75rem);
}
.brand small {
  margin: .2rem 0 0;
  font-size: clamp(1.05rem, 3.8vw, 1.65rem);
}
.brand-icon {
  color: #ffda7a;
  margin: 0 auto .45rem;
  position: relative;
  width: 1.4rem;
  height: 1.25rem;
}
.brand-icon i, .brand-icon::before, .brand-icon::after {
  position: absolute;
  content: "";
  border: 2px solid currentColor;
  border-radius: 50%;
}
.brand-icon i { width: 1.1rem; height: 1.1rem; left: .15rem; bottom: -.15rem; }
.brand-icon::before, .brand-icon::after { width: .55rem; height: .55rem; top: -.18rem; }
.brand-icon::before { left: -.23rem; }
.brand-icon::after { right: -.23rem; }
.main { margin: 0 auto; padding: .65rem 1rem 1rem; max-width: 1120px; }
.credits {
  max-width: 1120px;
  margin: 0 auto;
  padding: .25rem 1rem calc(6.7rem + env(safe-area-inset-bottom));
  color: var(--muted);
  font-size: .8125rem;
  line-height: 1.55;
}
.credits a { color: inherit; }
.destination-photo {
  position: relative;
  margin: 1rem 0 .4rem;
  overflow: hidden;
  background: var(--navy);
  border-radius: 18px;
  box-shadow: var(--shadow);
}
.destination-photo img {
  display: block;
  width: 100%;
  height: clamp(170px, 56vw, 330px);
  object-fit: cover;
  object-position: center 38%;
}
.destination-photo figcaption {
  position: absolute;
  inset: auto 0 0;
  padding: 1.6rem 1rem .75rem;
  background: linear-gradient(transparent, #04152be8);
  color: white;
  font-size: .875rem;
  font-weight: 650;
}
.planning-photo img { object-position: center 50%; }
.bottom { width: 100%; }
.bottom button { min-height: 44px; font-size: clamp(.625rem, 2.9vw, .875rem); }
.bottom button.active { color: #855500; }
body.dark .bottom button.active { color: #ffda7a; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid #1683c1;
  outline-offset: 2px;
}
.action .label { min-width: 0; }
.entry { flex-wrap: wrap; }
.row { flex-wrap: wrap; }
.field, .fields > * { min-width: 0; }
.count { background: linear-gradient(130deg, #245f99, #073568); }

@media (min-width: 760px) {
  .shell { border: 0; }
  .banner {
    height: clamp(235px, 29vw, 365px);
    padding: 0 max(2rem, calc((100vw - 1088px) / 2)) 1.4rem;
    background-size: auto, min(82vw, 1380px) auto;
    background-position: center, right 45%;
  }
  .bottom {
    position: sticky;
    top: 0;
    left: auto;
    bottom: auto;
    transform: none;
    width: min(calc(100% - 4rem), 1088px);
    margin: -1rem auto 0;
    padding: .4rem;
    border-radius: 18px;
  }
  .bottom button { border-radius: 12px; padding: .35rem; }
  .bottom button span { display: inline; margin-right: .4rem; font-size: 1rem; }
  .bottom button.active { background: #fff0c2; }
  body.dark .bottom button.active { background: #403525; }
  .main { padding: 1.35rem 2rem; }
  .credits { padding: 0 2rem 2rem; }

const planCats=[['Passagens','✈️','Companhia, valores e reserva'],['Hotéis','🛏️','Reservas, diárias e localização'],['Aluguel de carro','🚙','Locadora, período e valor'],['Parques e passeios','🎟️','Ingressos, reservas e datas'],['Compras','🛍️','Meta, controle e lojas'],['Outros','🍽️','Alimentação e demais planos']];function planning(){let pills=[['viagem','Viagem'],['roteiro','Roteiro'],['parques','Parques']];return `<div class="pilltabs">${pills.map(([k,n])=>`<button class="${sub===k?'active':''}" onclick="sub='${k}';render()">${n}</button>`).join('')}</div>${sub==='viagem'?`<div class="card"><h3>📅 Datas da viagem</h3><form onsubmit="saveDates(event)"><div class="fields"><div class="field"><label>Ida</label><input type="date" id="departure" value="${esc(state.departure)}"></div><div class="field"><label>Volta</label><input type="date" id="returnDate" value="${esc(state.returnDate)}"></div></div><button class="goldbtn">Salvar datas</button></form></div>${planCats.map(([n,i,d])=>action(i,n,d,`planType=${JSON.stringify(n).replace(/"/g,"&quot;")};sub='detalhe';render()`)).join('')}`:sub==='detalhe'?planDetails():sub==='roteiro'?itinerary():`<div class="card"><h3>🎟️ Parques e passeios</h3><p class="muted">Monte a lista dos parques que deseja visitar.</p>${planCats.filter(x=>x[0]==='Parques e passeios').map(x=>action(x[1],x[0],x[2],`planType='Parques e passeios';sub='detalhe';render()`)).join('')}</div>`}`}
function saveDates(e){e.preventDefault();let a=document.getElementById('departure').value,b=document.getElementById('returnDate').value;if(a&&b&&b<a)return toast('A volta precisa ser depois da ida');state.departure=a;state.returnDate=b;save();toast('Datas salvas!')}
function planDetails(){let arr=state.plans.filter(x=>x.category===planType);return `<button class="outline" onclick="sub='viagem';render()">‹ Voltar</button><div class="card"><h3>${esc(planType)}</h3><form onsubmit="addPlan(event)"><div class="field"><label>Nome ou empresa</label><input id="pName" required placeholder="Ex.: Hotel em Orlando"></div><div class="fields"><div class="field"><label>Data</label><input id="pDate" type="date"></div><div class="field"><label>Valor estimado (R$)</label><input id="pAmount" type="number" step="0.01" min="0" value="0"></div></div><div class="field"><label>Observações, código de reserva ou link</label><textarea id="pNote" rows="2"></textarea></div><button class="goldbtn">+ Adicionar opção</button></form></div><div class="card"><h3>Minhas opções</h3>${arr.length?arr.map(x=>`<div class="entry"><div class="info"><strong>${esc(x.name)}</strong><small>${esc(x.date||'Sem data')} · ${esc(x.note||'')}</small></div><div><div class="value">${money(x.amount,'BRL')}</div><button class="danger" onclick="removePlan(${x.id})">Excluir</button></div></div>`).join(''):'<p class="empty">Nenhuma opção cadastrada.</p>'}</div>`}function addPlan(e){e.preventDefault();state.plans.push({id:id(),category:planType,name:document.getElementById('pName').value,date:document.getElementById('pDate').value,amount:+document.getElementById('pAmount').value,note:document.getElementById('pNote').value});save();toast('Opção adicionada!')}function removePlan(i){if(confirm('Excluir esta opção?')){state.plans=state.plans.filter(x=>x.id!==i);save()}}
function itinerary(){return `<div class="card"><h3>🗓️ Meu roteiro</h3><form onsubmit="addDay(event)"><div class="field"><label>Dia do passeio</label><input type="date" id="dayDate" required></div><div class="field"><label>Atividade</label><input id="dayTitle" required placeholder="Ex.: Magic Kingdom"></div><div class="field"><label>Observações</label><input id="dayNote" placeholder="Horário, endereço, ingresso..."></div><button class="goldbtn">+ Adicionar ao roteiro</button></form></div><div class="card"><h3>Atividades planejadas</h3>${state.itinerary.length?state.itinerary.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="entry"><span>📍</span><div class="info"><strong>${esc(x.title)}</strong><small>${esc(x.date)} · ${esc(x.note)}</small></div><button class="danger" onclick="removeDay(${x.id})">Excluir</button></div>`).join(''):'<p class="empty">Seu roteiro começa aqui! 🏰</p>'}</div>`}function addDay(e){e.preventDefault();state.itinerary.push({id:id(),date:document.getElementById('dayDate').value,title:document.getElementById('dayTitle').value,note:document.getElementById('dayNote').value});save();toast('Dia adicionado!')}function removeDay(i){if(confirm('Excluir esta atividade?')){state.itinerary=state.itinerary.filter(x=>x.id!==i);save()}}
function finance(){return `<div class="pilltabs">${[['visao','Visão geral'],['despesas','Despesas'],['dolares','Dólares']].map(([k,n])=>`<button class="${fin===k?'active':''}" onclick="fin='${k}';edit=null;render()">${n}</button>`).join('')}</div>${fin==='visao'?`<div class="count"><small>💰 Custo total previsto</small><strong>${money(total(),'BRL')}</strong><span>Despesas registradas em reais</span></div><div class="card"><h3>Resumo das despesas</h3>${state.categories.map(c=>{let v=state.items.filter(x=>x.type===c).reduce((a,x)=>a+(+x.amount||0),0);return `<div class="entry"><div class="info"><strong>${esc(c)}</strong></div><div class="value">${money(v,'BRL')}</div></div>`}).join('')}</div><div class="tiles"><div class="tile green">📈<small style="display:block">Dólares guardados</small><strong>${money(saved())}</strong></div><div class="tile red">🎯<small style="display:block">Faltam guardar</small><strong>${money(Math.max(0,state.goal-saved()))}</strong></div></div><button class="goldbtn" onclick="fin='despesas';render()">＋ Adicionar despesa</button>`:fin==='despesas'?expenses():dollars()}`}
function expenses(){let x=state.items.find(x=>x.id===edit);return `<div class="card"><h3>🧾 ${x?'Editar':'Nova'} despesa</h3><form onsubmit="saveExpense(event)"><div class="field"><label>Descrição</label><input id="eName" required value="${esc(x?.name||'')}" placeholder="Ex.: Passagens aéreas"></div><div class="field"><label>Categoria</label><select id="eType">${state.categories.map(c=>`<option ${x?.type===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="fields"><div class="field"><label>Valor previsto (R$)</label><input type="number" id="eAmount" step="0.01" min="0" value="${x?.amount||0}"></div><div class="field"><label>Já pago (R$)</label><input type="number" id="ePaid" step="0.01" min="0" value="${x?.paid||0}"></div></div><div class="field"><label>Observações</label><input id="eNotes" value="${esc(x?.notes||'')}"></div><button class="goldbtn">${x?'Salvar alterações':'＋ Adicionar despesa'}</button></form></div><div class="card"><h3>Despesas cadastradas</h3><p class="muted">Previsto: ${money(total(),'BRL')} · Pago: ${money(paid(),'BRL')}</p>${state.items.length?state.items.map(x=>`<div class="entry"><span>🧾</span><div class="info"><strong>${esc(x.name)}</strong><small>${esc(x.type)} · Pago: ${money(x.paid,'BRL')}</small></div><div><div class="value">${money(x.amount,'BRL')}</div><button class="outline mini" onclick="edit=${x.id};render()">Editar</button><button class="danger mini" onclick="delExpense(${x.id})">Excluir</button></div></div>`).join(''):'<p class="empty">Nenhuma despesa cadastrada.</p>'}</div>`}function saveExpense(e){e.preventDefault();let o={id:edit||id(),name:document.getElementById('eName').value,type:document.getElementById('eType').value,amount:+document.getElementById('eAmount').value,paid:+document.getElementById('ePaid').value,notes:document.getElementById('eNotes').value};if(o.paid>o.amount)return toast('O valor pago excede o previsto');if(edit)state.items=state.items.map(x=>x.id===edit?o:x);else state.items.push(o);edit=null;save();toast('Despesa salva!')}function delExpense(i){if(confirm('Excluir despesa?')){state.items=state.items.filter(x=>x.id!==i);save()}}
function dollars(){return `<div class="count"><small>💵 Dólares guardados no planejamento</small><strong>${money(saved())}</strong><span>Estimativa em reais: ${money(saved()*state.rate,'BRL')}</span></div><div class="card"><h3>🏦 Registrar compra de dólares</h3><form onsubmit="addDeposit(event)"><div class="fields"><div class="field"><label>Valor (US$)</label><input id="dAmount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Data</label><input id="dDate" type="date" required value="${new Date().toISOString().slice(0,10)}"></div></div><div class="field"><label>Observação</label><input id="dNote" placeholder="Ex.: Compra no C6 Bank"></div><button class="goldbtn">＋ Registrar dólares</button></form></div><div class="card"><h3>📚 Histórico</h3><div class="entry"><span>🏦</span><div class="info"><strong>Saldo inicial</strong><small>Alterável em Ajustes</small></div><div class="value">${money(state.initial)}</div></div>${state.deposits.map(x=>`<div class="entry"><span>💵</span><div class="info"><strong>${esc(x.note||'Depósito')}</strong><small>${esc(x.date)}</small></div><div><div class="value">${money(x.amount)}</div><button class="danger" onclick="delDeposit(${x.id})">Excluir</button></div></div>`).join('')}</div>`}function addDeposit(e){e.preventDefault();state.deposits.push({id:id(),amount:+document.getElementById('dAmount').value,date:document.getElementById('dDate').value,note:document.getElementById('dNote').value});save();toast('Dólares registrados!')}function delDeposit(i){if(confirm('Excluir este depósito?')){state.deposits=state.deposits.filter(x=>x.id!==i);save()}}
function files(){return `<div class="card"><h3>📁 Meus arquivos</h3><p class="muted">Guarde aqui fotos, passagens, reservas e comprovantes da sua viagem.</p>${[['Passagens','✈️'],['Hotéis','🛏️'],['Aluguel de carro','🚙'],['Parques e passeios','🎟️'],['Compras','🛍️'],['Outros','📄']].map(([n,i])=>`<div class="entry"><span style="font-size:23px">${i}</span><div class="info"><strong>${n}</strong></div><small id="count-${n.replaceAll(' ','-')}"></small></div>`).join('')}</div><div class="card"><h3>☁️ Adicionar arquivo</h3><div class="upload"><div class="field"><label>Identificação</label><input id="fLabel" placeholder="Ex.: Reserva do hotel"></div><div class="field"><label>Categoria</label><select id="fCategory">${['Passagens','Hotéis','Aluguel de carro','Parques e passeios','Compras','Outros'].map(n=>`<option>${n}</option>`).join('')}</select></div><div class="field"><label>Fotos ou PDFs (até 15 MB por arquivo)</label><input id="fInput" type="file" accept="image/*,.pdf,application/pdf" multiple></div><button class="goldbtn" onclick="addFiles()">＋ Salvar anexos</button></div><p class="notice">Os anexos ficam neste navegador, não são enviados para a nuvem. O backup JSON dos valores não inclui os anexos. Guarde também os originais em lugar seguro.</p></div><div class="card"><h3>Documentos salvos</h3><div id="fileList" class="muted">Carregando...</div></div>`}
function settings(){return `<div class="card"><h3>☀️ Tema do aplicativo</h3><div class="row"><span>${state.dark?'🌙 Escuro':'☀️ Claro'}</span><label class="switch"><input type="checkbox" ${state.dark?'checked':''} onchange="state.dark=this.checked;save()"><span class="slider"></span></label></div></div><div class="card"><h3>⚙️ Dados da viagem</h3><form onsubmit="saveSettings(event)"><div class="fields"><div class="field"><label>Ano</label><input id="sYear" type="number" min="2026" max="2100" value="${state.year}"></div><div class="field"><label>Viajantes</label><input id="sTravelers" type="number" min="1" value="${state.travelers}"></div><div class="field"><label>Meta em dólares</label><input id="sGoal" type="number" min="0" step="0.01" value="${state.goal}"></div><div class="field"><label>Saldo inicial US$</label><input id="sInitial" type="number" min="0" step="0.01" value="${state.initial}"></div><div class="field full"><label>Cotação estimada (R$ por US$)</label><input id="sRate" type="number" min="0.01" step="0.01" value="${state.rate}"></div></div><button class="goldbtn">Salvar configurações</button></form></div><div class="card"><h3>🏷️ Categorias editáveis</h3><div class="field"><label>Separar por vírgulas</label><textarea id="sCategories" rows="3">${esc(state.categories.join(', '))}</textarea></div><button class="outline" onclick="saveCategories()">Atualizar categorias</button></div><div class="card"><h3>💾 Backup e restauração</h3><p class="notice">O backup JSON contém os dados financeiros, roteiro e planejamento, mas não inclui os anexos.</p><button class="goldbtn" onclick="exportData()">⬇️ Exportar backup</button><div class="field"><label>Restaurar backup JSON</label><input type="file" accept=".json,application/json" onchange="importData(event)"></div><button class="outline" onclick="exportReport()">📋 Exportar relatório CSV</button></div><div class="card"><h3>🗑️ Limpar dados</h3><p class="notice">Apaga o planejamento e as finanças. Os anexos são gerenciados separadamente na aba Arquivos.</p><button class="danger" onclick="resetData()">Apagar planejamento</button></div>`}function saveSettings(e){e.preventDefault();state.year=+document.getElementById('sYear').value||2027;state.travelers=Math.max(1,+document.getElementById('sTravelers').value||1);state.goal=Math.max(0,+document.getElementById('sGoal').value||0);state.initial=Math.max(0,+document.getElementById('sInitial').value||0);state.rate=Math.max(.01,+document.getElementById('sRate').value||5.3);save();toast('Configurações salvas!')}function saveCategories(){let x=document.getElementById('sCategories').value.split(',').map(s=>s.trim()).filter(Boolean);if(!x.length)return toast('Informe categorias');state.categories=[...new Set(x)];save();toast('Categorias atualizadas!')}function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}function exportData(){download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'orlando-2027-backup.json')}async function importData(e){let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.items)||!Array.isArray(x.deposits)||!Array.isArray(x.categories))throw Error('Formato');if(confirm('Substituir dados atuais?')){state={...fresh,...x};for(let k of ['plans','itinerary'])if(!Array.isArray(state[k]))state[k]=[];save();toast('Backup restaurado!')}}catch{toast('Backup inválido')}}function exportReport(){let rows=[['Categoria','Descrição','Previsto R$','Pago R$','Observações'],...state.items.map(x=>[x.type,x.name,x.amount,x.paid,x.notes])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'orlando-despesas.csv')}function resetData(){if(confirm('Apagar todo o planejamento e dados financeiros?')){let dark=state.dark;state={...fresh,dark};save();toast('Dados reiniciados')}}
const DB='orlando2027_anexos';function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function allFiles(){let db=await openDB();return new Promise((ok,no)=>{let tx=db.transaction('files','readonly'),r=tx.objectStore('files').getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);tx.oncomplete=()=>db.close()})}async function addFiles(){let files=[...document.getElementById('fInput').files],label=document.getElementById('fLabel').value,category=document.getElementById('fCategory').value;if(!files.length)return toast('Selecione arquivos');try{let db=await openDB(),n=0;for(let f of files){if(!(f.type.startsWith('image/')||f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'))||f.size>15*1048576){toast('Aceitos apenas imagens ou PDFs de até 15 MB');continue}await new Promise((ok,no)=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').put({id:String(id()),name:f.name,label:label||f.name,category,blob:f,date:new Date().toISOString()});tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});n++}db.close();render();toast(n+' arquivo(s) salvo(s)')}catch{toast('Não foi possível salvar os arquivos')}}async function loadFiles(){let el=document.getElementById('fileList');if(!el)return;try{let all=(await allFiles()).sort((a,b)=>b.date.localeCompare(a.date));for(let cat of ['Passagens','Hotéis','Aluguel de carro','Parques e passeios','Compras','Outros']){let e=document.getElementById('count-'+cat.replaceAll(' ','-'));if(e)e.textContent=all.filter(x=>x.category===cat).length+' arquivo(s)'}el.innerHTML=all.length?all.map(x=>`<div class="entry"><span>📎</span><div class="info"><strong>${esc(x.label)}</strong><small>${esc(x.category)} · ${esc(x.name)}</small></div><div><button class="outline mini" onclick="openFile('${x.id}')">Abrir</button><button class="danger mini" onclick="delFile('${x.id}')">Excluir</button></div></div>`).join(''):'<p class="empty">Nenhum arquivo salvo ainda.</p>'}catch{el.textContent='Este navegador não permitiu acessar os anexos.'}}async function openFile(i){let x=(await allFiles()).find(x=>x.id===i);if(x)download(x.blob,x.name)}async function delFile(i){if(!confirm('Excluir este arquivo?'))return;let db=await openDB(),tx=db.transaction('files','readwrite');tx.objectStore('files').delete(i);tx.oncomplete=()=>{db.close();loadFiles();toast('Arquivo excluído')}}render();

</script>
</body>
</html>
